svg.tl .tl-bg{fill:var(--tl-surface)}svg.tl .tl-rule{stroke:var(--tl-line);stroke-width:1.5;fill:none}
svg.tl .tl-plan-rule{stroke:var(--tl-line);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
svg.tl .tl-label{fill:var(--tl-ink);font-size:13.5px;font-weight:500}
svg.tl .tl-sub{fill:var(--tl-muted);font-size:12px;font-variant-numeric:tabular-nums}
svg.tl .tl-pill{fill:var(--tl-pill);stroke:var(--tl-line);stroke-width:1}
