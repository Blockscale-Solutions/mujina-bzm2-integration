svg.tl .tl-bg{fill:var(--tl-surface)}svg.tl .tl-rule{stroke:var(--tl-line);stroke-width:1.5;fill:none}
svg.tl .tl-plan-rule{stroke:var(--tl-line);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
svg.tl .tl-label{fill:var(--tl-ink);font-size:13.5px;font-weight:500}
svg.tl .tl-sub{fill:var(--tl-muted);font-size:12px;font-variant-numeric:tabular-nums}
svg.tl .tl-pill{fill:var(--tl-pill);stroke:var(--tl-line);stroke-width:1}
svg.tl .tl-band{fill:var(--tl-ink);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
svg.tl .tl-gap{fill:var(--tl-muted);font-size:11.5px;font-style:italic}
svg.tl .tl-cut{fill:var(--tl-surface)}
svg.tl .tl-dot{fill:var(--tl-accent);stroke:var(--tl-surface);stroke-width:2}
svg.tl .tl-said{fill:var(--tl-surface);stroke:var(--tl-said);stroke-width:2.5}
svg.tl .tl-bound{fill:var(--tl-surface);stroke:var(--tl-accent);stroke-width:2}
svg.tl .tl-plan{fill:var(--tl-surface);stroke:var(--tl-muted);stroke-width:2;stroke-dasharray:3 2}
</style>
