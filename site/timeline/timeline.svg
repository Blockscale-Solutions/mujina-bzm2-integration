<title id="tl-title-key">Timeline, high-level view, 2025-06-09 to 2026-09-28</title>
<desc id="tl-desc-key">12 milestones in order along a vertical line, alternating sides, then what is planned; spaced by order, not by time. A pill marks each new year and a break marks each gap of more than a month. The same list follows as text.</desc>
<style>
svg.tl{--tl-ink:#1a1917;--tl-muted:#6b665e;--tl-line:rgba(26,25,23,.28);--tl-accent:#0e938b;--tl-surface:#ffffff;--tl-said:#b45309;--tl-pill:#efece6;font-family:Ubuntu,ui-sans-serif,system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){svg.tl:root,:root:not([data-theme="light"]) svg.tl{--tl-ink:#d6dde3;--tl-muted:#8b95a0;--tl-line:rgba(214,221,227,.3);--tl-accent:#2dd4bf;--tl-surface:#151a1f;--tl-said:#f59e0b;--tl-pill:#232a31}}
