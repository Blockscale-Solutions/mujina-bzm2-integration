svg.tl .tl-gap{fill:var(--tl-muted);font-size:11.5px;font-style:italic}
svg.tl .tl-cut{fill:var(--tl-surface)}
svg.tl .tl-dot{fill:var(--tl-accent);stroke:var(--tl-surface);stroke-width:2}
svg.tl .tl-said{fill:var(--tl-surface);stroke:var(--tl-said);stroke-width:2.5}
