<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img"
     aria-label="Stylized RDS 2.0 control-board schematic: PSU, fans, control board, hashboard chain seats">
  <title>RDS 2.0 control-board schematic (original)</title>
  <desc>Original stylized schematic for Mujina BZM2 bring-up. Schematic is not a photograph. No measurements.</desc>
  <rect x="16" y="16" width="828" height="500" rx="10" fill="#12171c" stroke="#3a4650" stroke-width="1.5"/>
  <text x="430" y="42" text-anchor="middle" fill="#7a8792" font-family="Orbitron,sans-serif" font-size="9" font-weight="600" letter-spacing="0.14em">RDS 2.0 · CONTROL PLANE + HASHBOARD CHAIN</text>

  <!-- harness -->
  <g fill="none" stroke-linecap="round">
    <path d="M156 260 H200" stroke="#e86a2b" stroke-width="3"/>
    <path d="M254 120 V160" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M364 120 V160" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M520 200 H560 V140 H600" stroke="#2dd4bf" stroke-width="2.5"/>
    <path d="M520 260 H600" stroke="#2dd4bf" stroke-width="2.5"/>
    <path d="M520 320 H560 V388 H600" stroke="#2dd4bf" stroke-width="2.5"/>
  </g>

  <!-- PSU -->
  <g>
    <rect x="36" y="180" width="120" height="160" rx="6" fill="#252018" stroke="#e86a2b" stroke-width="1.6"/>
    <text x="48" y="198" fill="#d6dde3" font-family="Orbitron,sans-serif" font-size="10" font-weight="600">PSU</text>
    <text x="48" y="214" fill="#9aa7b2" font-size="9" font-family="Ubuntu,sans-serif">system power</text>
  </g>

  <!-- Fans -->
  <g>
    <rect x="210" y="48" width="88" height="72" rx="36" fill="#1a2228" stroke="#3d4a55" stroke-width="1.3"/>
    <circle cx="254" cy="84" r="8" fill="#2dd4bf" opacity="0.7"/>
    <circle cx="254" cy="84" r="26" fill="none" stroke="#3d4a55" stroke-width="2"/>
    <text x="254" y="42" text-anchor="middle" fill="#d6dde3" font-family="Orbitron,sans-serif" font-size="10">FAN 0</text>
  </g>
  <g>
    <rect x="320" y="48" width="88" height="72" rx="36" fill="#1a2228" stroke="#3d4a55" stroke-width="1.3"/>
    <circle cx="364" cy="84" r="8" fill="#2dd4bf" opacity="0.7"/>
    <circle cx="364" cy="84" r="26" fill="none" stroke="#3d4a55" stroke-width="2"/>
    <text x="364" y="42" text-anchor="middle" fill="#d6dde3" font-family="Orbitron,sans-serif" font-size="10">FAN 1</text>
  </g>

  <!-- Control board -->
  <g>
    <rect x="200" y="160" width="320" height="220" rx="6" fill="#1a2a28" stroke="#2dd4bf" stroke-width="2"/>
    <text x="360" y="178" text-anchor="middle" fill="#d6dde3" font-family="Orbitron,sans-serif" font-size="10" font-weight="600">RDS 2.0</text>
    <text x="360" y="194" text-anchor="middle" fill="#9aa7b2" font-size="9" font-family="Ubuntu,sans-serif">control board</text>
    <rect x="218" y="208" width="110" height="70" rx="4" fill="#1a2228" stroke="#2e3942"/>
    <text x="273" y="240" text-anchor="middle" fill="#5a6a76" font-family="JetBrains Mono,monospace" font-size="8">HOST / MCU</text>
    <rect x="350" y="208" width="70" height="36" rx="3" fill="#1a2228" stroke="#2e3942"/>
    <text x="385" y="230" text-anchor="middle" fill="#5a6a76" font-family="JetBrains Mono,monospace" font-size="8">FAN HDR</text>
    <rect x="218" y="300" width="70" height="36" rx="3" fill="#1a2228" stroke="#2e3942"/>
    <text x="253" y="322" text-anchor="middle" fill="#5a6a76" font-family="JetBrains Mono,monospace" font-size="8">PWR IN</text>
    <rect x="430" y="208" width="70" height="128" rx="3" fill="#1a2228" stroke="#2e3942"/>
    <text x="465" y="238" text-anchor="middle" fill="#5a6a76" font-family="JetBrains Mono,monospace" font-size="8">CHAIN</text>
    <text x="465" y="254" text-anchor="middle" fill="#5a6a76" font-family="JetBrains Mono,monospace" font-size="8">UART</text>
  </g>

  <!-- Hashboards -->
  <g>
    <rect x="600" y="96" width="200" height="88" rx="6" fill="#1c2329" stroke="#4a5864" stroke-width="1.3"/>
    <text x="614" y="114" fill="#d6dde3" font-family="Orbitron,sans-serif" font-size="10" font-weight="600">HB0</text>
    <text x="614" y="128" fill="#9aa7b2" font-size="9" font-family="Ubuntu,sans-serif">hashboard · chain seat 0</text>
    <rect x="628" y="130" width="28" height="28" rx="3" fill="#151a1f" stroke="#3a4650"/>
    <rect x="666" y="130" width="28" height="28" rx="3" fill="#151a1f" stroke="#3a4650"/>
    <rect x="704" y="130" width="28" height="28" rx="3" fill="#151a1f" stroke="#3a4650"/>
    <rect x="742" y="130" width="28" height="28" rx="3" fill="#151a1f" stroke="#3a4650"/>
  </g>
  <g>
    <rect x="600" y="220" width="200" height="88" rx="6" fill="#1c2329" stroke="#4a5864" stroke-width="1.3"/>
    <text x="614" y="238" fill="#d6dde3" font-family="Orbitron,sans-serif" font-size="10" font-weight="600">HB1</text>
    <text x="614" y="252" fill="#9aa7b2" font-size="9" font-family="Ubuntu,sans-serif">hashboard · chain seat 1</text>
    <rect x="628" y="254" width="28" height="28" rx="3" fill="#151a1f" stroke="#3a4650"/>
    <rect x="666" y="254" width="28" height="28" rx="3" fill="#151a1f" stroke="#3a4650"/>
    <rect x="704" y="254" width="28" height="28" rx="3" fill="#151a1f" stroke="#3a4650"/>
    <rect x="742" y="254" width="28" height="28" rx="3" fill="#151a1f" stroke="#3a4650"/>
  </g>
  <g>
    <rect x="600" y="344" width="200" height="88" rx="6" fill="#1c2329" stroke="#4a5864" stroke-width="1.3"/>
    <text x="614" y="362" fill="#d6dde3" font-family="Orbitron,sans-serif" font-size="10" font-weight="600">HB2</text>
    <text x="614" y="376" fill="#9aa7b2" font-size="9" font-family="Ubuntu,sans-serif">hashboard · chain seat 2</text>
    <rect x="628" y="378" width="28" height="28" rx="3" fill="#151a1f" stroke="#3a4650"/>
    <rect x="666" y="378" width="28" height="28" rx="3" fill="#151a1f" stroke="#3a4650"/>
    <rect x="704" y="378" width="28" height="28" rx="3" fill="#151a1f" stroke="#3a4650"/>
    <rect x="742" y="378" width="28" height="28" rx="3" fill="#151a1f" stroke="#3a4650"/>
  </g>

  <text x="430" y="536" text-anchor="middle" fill="#5a6a76" font-family="JetBrains Mono,monospace" font-size="7.5">schematic ≠ photo · seats are topological · no invented measurements</text>
</svg>
